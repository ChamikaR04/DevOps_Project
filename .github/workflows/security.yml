name: DevSecOps Security Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

  sast-semgrep:
    runs-on: ubuntu-latest
    needs: build-and-test
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (full scan, no baseline)
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/nodejsscan --error backend

  dependency-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: npm audit (reports only, does not block)
        working-directory: backend
        run: npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t library-backend:ci ./backend
      - name: Trivy scan (reports only, does not block)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: library-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '0'