name: Secret Management Check

on:
  push:
    branches:
      - Nuran
  workflow_dispatch:

jobs:
  secret-check:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017

    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secret is available
        shell: bash
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "MONGO_URL secret is not available"
            exit 1
          fi

          echo "MONGO_URL secret is available to the workflow."
          echo "Secret value is intentionally not displayed."