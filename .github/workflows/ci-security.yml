name: CI Security Pipeline

on:
  push:
    branches:
      - Nuran
  pull_request:
    branches:
      - Nuran
  workflow_dispatch:

jobs:

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript